name: frontend
description: "TruthLens AI Frontend"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Core ─────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  custom_image_crop: 0.1.1   # avatar cropping on profile screen
  fl_chart: ^0.69.0           # analytics charts

  # ── Networking & Local Storage ────────────────────────────
  http: ^1.2.1                # API calls to backend
  shared_preferences: ^2.2.3  # tutorial state, news cache

  # ── Camera & Image ────────────────────────────────────────
  camera: ^0.11.0             # live capture on scan screen
  image: ^4.1.7               # image manipulation
  image_picker: ^1.1.2        # gallery upload on scan screen

  # ── Device & Platform ─────────────────────────────────────
  path_provider: ^2.1.2       # local file paths
  share_plus: ^10.1.2         # share scan results
  url_launcher: ^6.3.0        # open news articles in browser

  # ── Notifications ─────────────────────────────────────────
  flutter_local_notifications: ^18.0.0  # streak reminders
  timezone: ^0.9.4                       # notification scheduling

  # ── Firebase (replaces the old backend) ───────────────────
  firebase_core: ^5.0.0       # app init
  firebase_auth: ^7.0.0       # accounts, email links
  cloud_firestore: ^7.0.0     # history, badges, leaderboard

  # ── On-device detection ───────────────────────────────────
  tflite_flutter: ^0.12.1               # deepfake model inference
  google_mlkit_face_detection: ^0.15.1  # face check before inference
  exif: ^3.3.0                          # EXIF metadata analysis

  # ── Removed ───────────────────────────────────────────────
  # http_parser      — included inside http package
  # screenshot       — not used in any screen
  # workmanager      — no background tasks implemented

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    - assets/challenge/real/
    - assets/challenge/fake/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21