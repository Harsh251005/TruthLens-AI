name: frontend
description: "TruthLens AI Frontend"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  http_parser: ^4.0.2
  share_plus: ^10.1.2
  screenshot: ^3.0.0
  tflite_flutter: ^0.11.0
  google_mlkit_face_detection: ^0.11.0
  image: ^4.1.7
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/deepfake_detector.tflite