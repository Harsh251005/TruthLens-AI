[project]
name = "backend"
version = "0.1.0"
description = "Backend code for the TruthLensAI Application"
requires-python = ">=3.11,<3.13"

dependencies = [

    # ── Web Framework / API ─────────────────────────────────
    "fastapi>=0.132.0",
    "uvicorn>=0.41.0",
    "starlette>=0.52.1",
    "python-multipart>=0.0.22",
    "aiofiles>=24.1.0",

    # ── Database ────────────────────────────────────────────
    "mysql-connector-python>=9.6.0",
    "pymysql>=1.1.2",

    # ── Authentication & Security ───────────────────────────
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",  # pinned for passlib compatibility
    "cryptography>=46.0.5",

    # ── Config & Validation ─────────────────────────────────
    "python-dotenv>=1.2.1",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "email-validator>=2.3.0",

    # ── Email Services ──────────────────────────────────────
    "fastapi-mail>=1.6.2",
    "aiosmtplib>=5.1.0",
    "resend==2.10.0",

    # ── AI / Inference (Lightweight) ────────────────────────
    "ai-edge-litert>=1.0.1",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.9.0",
    "pillow>=12.1.1",

    # ── Model / Data Tools (Dev + Training) ─────────────────
    "keras>=3.13.2",
    "pandas>=3.0.0",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",

    # ── Dev Tools ───────────────────────────────────────────
    "jupyterlab>=4.5.4",
    "gradio>=6.5.1",

    # ── Model Download / External APIs ──────────────────────
    "huggingface_hub>=0.30.2",

    # ── Image Metadata (EXIF) ───────────────────────────────
    "piexif>=1.1.3",

    # ── LLM Integration ─────────────────────────────────────
    "groq>=1.1.1",
]