[project]
name = "backend"
version = "0.1.0"
description = "Backend code for the TruthLensAI Application"
requires-python = ">=3.11,<3.13"

dependencies = [

    # ── Web Framework / API ─────────────────────────────────
    "fastapi>=0.132.0",
    "uvicorn>=0.41.0",
    "python-multipart>=0.0.22",   # file uploads (scan images)
    "aiofiles>=24.1.0",           # async file handling

    # ── Database ────────────────────────────────────────────
    "mysql-connector-python>=9.6.0",  # primary MySQL driver
    # pymysql removed — redundant with mysql-connector-python

    # ── Authentication & Security ───────────────────────────
    "python-jose[cryptography]>=3.5.0",  # JWT tokens
    "passlib[bcrypt]>=1.7.4",            # password hashing
    "bcrypt==4.0.1",                     # pinned for passlib compatibility
    "cryptography>=46.0.5",              # jose dependency

    # ── Config & Validation ─────────────────────────────────
    "python-dotenv>=1.2.1",
    "pydantic[email]>=2.12.5",
    "email-validator>=2.3.0",
    # pydantic-settings removed — BaseSettings not used in this project

    # ── Email ───────────────────────────────────────────────
    "resend==2.10.0",
    # fastapi-mail and aiosmtplib removed — switched to Resend (HTTPS)

    # ── AI / Inference ──────────────────────────────────────
    "ai-edge-litert>=1.0.1",          # TFLite model inference
    "numpy>=1.26.4",                  # array ops for model input/output
    "opencv-python-headless>=4.9.0",  # image preprocessing
    "pillow>=12.1.1",                 # image loading

    # ── Image Metadata ──────────────────────────────────────
    "piexif>=1.1.3",   # EXIF metadata extraction

    # ── External APIs ───────────────────────────────────────
    "groq>=1.1.1",      # LLM explanations via Groq
    "requests>=2.31.0", # NewsAPI HTTP calls in news_service.py

    # ── Removed (training / dev only — never used in prod) ──
    # keras, pandas, scikit-learn, matplotlib, seaborn, tqdm
    # jupyterlab, gradio, huggingface_hub
]